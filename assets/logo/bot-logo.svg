<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1b52"/>
      <stop offset="1" stop-color="#0d0918"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#ffc98a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="500" cy="540" r="300" fill="#fff"/>
      <circle cx="660" cy="430" r="250" fill="#000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="180" cy="200" r="7"/><circle cx="820" cy="170" r="6"/><circle cx="860" cy="760" r="8"/>
    <circle cx="150" cy="820" r="6"/><circle cx="300" cy="140" r="4"/><circle cx="740" cy="880" r="5"/>
  </g>
  <circle cx="500" cy="540" r="300" fill="#ffb86b" opacity="0.35" filter="url(#haze)" mask="url(#crescent)"/>
  <rect width="1024" height="1024" fill="url(#moon)" mask="url(#crescent)"/>
  <path d="M300 640 q40 34 80 0" fill="none" stroke="#3a2a55" stroke-width="18" stroke-linecap="round"/>
  <ellipse cx="300" cy="700" rx="34" ry="16" fill="#ff7ab0" opacity="0.7"/>
  <path d="M352 720 q22 18 44 0" fill="none" stroke="#3a2a55" stroke-width="12" stroke-linecap="round"/>
  <path d="M240 450 C230 230 560 150 700 300" fill="none" stroke="#ff5fa2" stroke-width="40" stroke-linecap="round" filter="url(#glow)"/>
  <rect x="190" y="420" width="100" height="160" rx="46" fill="#ff5fa2" transform="rotate(-12 240 500)"/>
  <rect x="640" y="250" width="100" height="150" rx="44" fill="#5ee7ff" transform="rotate(38 690 325)" filter="url(#glow)"/>
  <g font-family="Arial Rounded MT Bold, Helvetica, Arial, sans-serif" font-weight="700" fill="#a78bfa" filter="url(#glow)">
    <text x="660" y="660" font-size="90">z</text>
    <text x="740" y="560" font-size="120">z</text>
    <text x="830" y="440" font-size="150">Z</text>
  </g>
</svg>
